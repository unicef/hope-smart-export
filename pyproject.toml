[project]
name = "hope-smart-export"
version = "0.3.0"
description = ""
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
classifiers = [
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "django-admin-extra-buttons",
  "django-adminactions",
  "django-strategy-field",
  "xlsxwriter",
]
urls.Documentation = "https://unicef.github.io/hope-smart-export/"
urls.Homepage = "https://github.com/unicef/hope-smart-export"

[dependency-groups]
dev = [
  "bump2version",
  "django",
  "django-webtest",
  "factory-boy",
  "ipython",
  "openpyxl",
  "pdbpp",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-echo",
  "tox",
]
docs = [
  "mkdocs",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-material",
  "mkdocstrings-python",
]
