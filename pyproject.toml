[project]
name = "hope-smart-export"
version = "0.3.0"
description = ""
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "django-admin-extra-buttons",
  "django-adminactions",
  "django-strategy-field",
  "xlsxwriter",
]

optional-dependencies.docs = [
  "mkdocs",
  "mkdocs-awesome-pages-plugin",
  "mkdocs-material",
  "mkdocstrings-python",
]
urls.Documentation = "https://unicef.github.io/hope-smart-export/"
urls.Homepage = "https://github.com/unicef/hope-smart-export"

[tool.uv]
dev-dependencies = [
  "bump2version",
  "django-webtest",
  "django",
  "factory-boy",
  "ipython",
  "openpyxl",
  "pdbpp",
  "pre-commit",
  "pytest-cov",
  "pytest-django",
  "pytest-echo",
  "pytest",
  "tox",
]
